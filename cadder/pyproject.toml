[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"  # finds src/cadder itself; ships every file in it (SVG sketches, HTML)

[project]
name = "cadder"
version = "0.1.0"
description = "Framework for software-driven CAD projects on PythonSCAD: parts, assemblies, FEM, diff, FreeCAD"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "planegcs>=0.9.6",  # FreeCAD's sketch solver (CPSK); macOS builds it from source: brew install eigen boost
    "pythonscad>=1.1",
    "typer>=0.29.2",
]

[tool.uv.build-backend]
module-name = ["cadder", "cpsk_core"]

[project.optional-dependencies]
diff = ["numpy>=2", "manifold3d>=3.0"]
photo = ["numpy>=2", "opencv-python-headless>=4.10", "pillow>=11", "pillow-heif>=0.20"]  # cadder.photo
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
cadder = "cadder.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["freecad-addon/CPSK"]  # the FreeCAD addon's package, tested without FreeCAD
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "freecad-addon/CPSK"]
# cpsk_core runs in FreeCAD's Python too (plan D1): keep it to Python 3.11 syntax
per-file-target-version = { "src/cpsk_core/**" = "py311", "tests/test_cpsk_core.py" = "py311", "tests/cpsk_freecad/**" = "py311", "freecad-addon/**" = "py311", "tests/test_cpsk_freecad.py" = "py311" }

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "TID"]
ignore = [
    "F403", "F405",  # star imports are not used, but keep PythonSCAD examples pasteable
    "RUF001", "RUF002", "RUF003",  # ×, –, → and box-drawing characters in docstrings/comments
]

# cadder is a framework: it never imports a project (its tests use their own fixture project)
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"plotzker".msg = "cadder must not depend on a project"

[tool.ruff.lint.isort]
known-first-party = ["cadder", "cpsk_core", "cpsk_freecad"]
known-third-party = ["pythonscad", "vtk"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "stubs", "freecad-addon/CPSK"]
packages = ["cadder", "cpsk_core", "cpsk_freecad"]
strict = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["cadder.fem.viz_render", "cadder.freecad.build"]  # run in FreeCAD's Python, not this one
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["manifold3d", "FreeCAD", "Part", "Sketcher", "pillow_heif"]  # no type stubs (FreeCAD's: the CPSK addon)
ignore_missing_imports = true
