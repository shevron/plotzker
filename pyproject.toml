[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"  # finds src/plotter_cad itself; ships every file in it (incl. SVG sketches)

[project]
name = "plotter-cad"
version = "0.1.0"
description = "Parametric CAD (PythonSCAD) for the DIY pen plotter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = ["pythonscad>=1.1"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
plotter-cad = "plotter_cad.build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "F403", "F405",  # star imports are not used, but keep PythonSCAD examples pasteable
    "RUF001", "RUF002", "RUF003",  # ×, –, → and box-drawing characters in docstrings/comments
]

[tool.ruff.lint.isort]
known-first-party = ["plotter_cad"]
known-third-party = ["pythonscad"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "stubs"]
packages = ["plotter_cad"]
strict = true
cache_dir = ".mypy_cache"

[tool.uv]
python-preference = "only-system"  # use the pyenv interpreter (.python-version), no uv-managed download
