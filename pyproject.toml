[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"  # finds src/plotzker itself; ships every file in it (TOML data, SVG)

[project]
name = "plotzker"
version = "0.1.0"
description = "Parametric CAD (PythonSCAD) for the DIY pen plotter"
readme = "README.md"
license = "CC-BY-SA-4.0"  # the plotter's designs; README §8 has the whole repository's map
license-files = ["LICENSE", "LICENSES/CC-BY-SA-4.0.txt"]
requires-python = ">=3.14"
dependencies = [
    "cadder",
    "pyserial>=3.5",
    "pythonscad>=1.1",
    "typer>=0.29.2",
]

[project.optional-dependencies]
diff = ["cadder[diff]"]
photo = ["cadder[photo]"]  # measuring parts from photos (docs/photo-measurement.md)
dev = [
    "mypy>=1.10",
    "pytest>=8",
    "ruff>=0.6",
    "types-pyserial>=3.5.0.20261122",
]

[project.scripts]
plotzker = "plotzker.cli:main"

[tool.cadder]
project = "plotzker.project:PROJECT"  # the cadder CLI finds the project here

[tool.uv.workspace]
members = ["cadder"]  # the generic framework, developed here until it moves to its own repo

[tool.uv.sources]
cadder = { workspace = true }

[tool.uv]
python-preference = "only-system"  # use the pyenv interpreter (.python-version), no uv-managed download

[tool.pytest.ini_options]
testpaths = ["tests", "cadder/tests"]
# the FreeCAD addon's package (tested without FreeCAD) and the firmware scripts
pythonpath = ["cadder/freecad-addon/CPSK", "firmware"]
addopts = "-ra"

# Ruff: these settings cover src/ and tests/; cadder/ has its own (cadder/pyproject.toml).
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "F403", "F405",  # star imports are not used, but keep PythonSCAD examples pasteable
    "RUF001", "RUF002", "RUF003",  # ×, –, → and box-drawing characters in docstrings/comments
]

[tool.ruff.lint.isort]
known-first-party = ["plotzker"]
known-third-party = ["cadder", "pythonscad", "vtk"]  # cadder: a separate package (workspace member)

# Mypy checks both packages in one run.
[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "cadder/src", "cadder/stubs", "cadder/freecad-addon/CPSK"]
packages = ["plotzker", "cadder", "cpsk_core", "cpsk_freecad"]
strict = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = ["cadder.fem.viz_render", "cadder.freecad.build"]  # run in FreeCAD's Python, not this one
ignore_errors = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["manifold3d", "FreeCAD", "Part", "Sketcher", "pillow_heif"]  # no type stubs (FreeCAD's: the CPSK addon)
ignore_missing_imports = true
