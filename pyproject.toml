[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"  # finds src/plotzker itself; ships every file in it (incl. SVG sketches)

[project]
name = "plotzker"
version = "0.1.0"
description = "Parametric CAD (PythonSCAD) for the DIY pen plotter"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pythonscad>=1.1",
    "typer>=0.29.2",
]

[project.optional-dependencies]
diff = ["numpy>=2", "manifold3d>=3.0"]
dev = ["mypy>=1.10", "pytest>=8", "ruff>=0.6"]

[project.scripts]
plotzker = "plotzker.build:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "F403", "F405",  # star imports are not used, but keep PythonSCAD examples pasteable
    "RUF001", "RUF002", "RUF003",  # ×, –, → and box-drawing characters in docstrings/comments
]

[tool.ruff.lint.isort]
known-first-party = ["plotzker"]
known-third-party = ["pythonscad", "vtk"]

[tool.mypy]
python_version = "3.14"
mypy_path = ["src", "stubs"]
packages = ["plotzker"]
strict = true
cache_dir = ".mypy_cache"

[[tool.mypy.overrides]]
module = "plotzker.fem.viz_render"  # runs in FreeCAD's Python (vtk), not in this environment
ignore_errors = true
ignore_missing_imports = true

[tool.uv]
python-preference = "only-system"  # use the pyenv interpreter (.python-version), no uv-managed download

[[tool.mypy.overrides]]
module = "manifold3d"  # no type stubs
ignore_missing_imports = true
